<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${deck.title()}, ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/flashcards.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('flashcards')}"></header>

<span id="flash-data"
      th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError},data-flash-info=${flashInfo}"
      style="display:none;"></span>

<main class="fc-page fc-detail-page">
  <div class="fc-form-head">
    <a class="fc-back" th:href="@{/my/flashcards}">&larr; Danh sách bộ thẻ</a>
  </div>

  <section class="fc-detail-card">
    <!-- Owner edit/delete: faint icon buttons in the top-right corner. -->
    <div class="fc-detail-actions" th:if="${deck.owner()}">
      <button type="button" class="fc-icon-action fc-share-open"
              title="Chia sẻ" aria-label="Chia sẻ" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <a class="fc-icon-action" th:href="@{|/my/flashcards/${deck.id()}/edit|}"
         title="Chỉnh sửa" aria-label="Chỉnh sửa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </a>
      <form th:action="@{|/my/flashcards/${deck.id()}/delete|}" method="post"
            onsubmit="return confirm('Xoá bộ thẻ này?');">
        <button type="submit" class="fc-icon-action fc-icon-danger"
                title="Xoá bộ thẻ" aria-label="Xoá bộ thẻ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </form>
    </div>
    <h1 class="fc-detail-title" th:text="${deck.title()}">Tên bộ thẻ</h1>
    <p class="fc-detail-desc" th:if="${deck.description() != null}" th:text="${deck.description()}">Mô tả</p>
    <div class="fc-detail-meta">
      <span class="fc-badge" th:text="${deck.cardCount()} + ' thẻ'">0 thẻ</span>
      <!-- Owner: the badge doubles as the modal opener, and shows even at zero so
           a first-time sharer has a labelled way in. Others see it read-only. -->
      <button type="button" class="fc-badge fc-badge-shared fc-share-open"
              th:if="${deck.owner()}"
              th:text="${#lists.size(deck.targetClasses())} + ' lớp · ' + ${deck.memberCount()} + ' người'"
              aria-haspopup="dialog">0 lớp · 0 người</button>
      <span class="fc-badge fc-badge-shared" th:if="${deck.shared()} and ${!deck.owner()}"
            th:text="'Chia sẻ với ' + ${#strings.listJoin(deck.targetClasses().![name()], ', ')}">Đã chia sẻ</span>
      <span class="fc-badge fc-badge-due" th:if="${dueCount > 0}"
            th:text="'Còn ' + ${dueCount} + ' thẻ đến hạn'">Đến hạn</span>
    </div>

    <!-- Study launchers -->
    <div class="fc-launchers" th:if="${deck.cardCount() > 0}">
      <a class="fc-btn fc-btn-primary" th:href="@{|/my/flashcards/${deck.id()}/flip|}">Học lật thẻ</a>
      <a class="fc-btn fc-btn-secondary" th:href="@{|/my/flashcards/${deck.id()}/review|}">Ôn tập thông minh</a>
    </div>
    <p class="fc-empty" th:if="${deck.cardCount() == 0}">Bộ thẻ chưa có thẻ nào để học.</p>

  </section>
</main>

<!-- Share modal (owner only). Every row acts on its own; there is no submit. -->
<dialog id="fcShareDialog" class="fc-share-dialog" th:if="${deck.owner()}"
        th:attr="data-deck-id=${deck.id()},data-share-token=${deck.shareToken()}">
  <div class="fc-share-dialog-head">
    <h2 class="fc-share-dialog-title">Chia sẻ bộ thẻ</h2>
    <button type="button" class="fc-icon-action" id="fcShareClose"
            title="Đóng" aria-label="Đóng">&times;</button>
  </div>

  <section class="fc-share-section">
    <h3 class="fc-section-title">Lớp học</h3>
    <!-- Filtering an empty list is noise, so the box only ships with rows. -->
    <input type="search" id="fcClassSearch" class="fc-share-search"
           th:if="${!#lists.isEmpty(shareClasses)}"
           placeholder="Tìm lớp..." aria-label="Tìm lớp" autocomplete="off">
    <ul class="fc-share-rows" th:unless="${#lists.isEmpty(shareClasses)}">
      <li class="fc-share-row" th:each="c : ${shareClasses}"
          th:attr="data-class-id=${c.id()},data-class-name=${c.name()}">
        <span class="fc-share-row-name" th:text="${c.name()}">Lớp</span>
        <label class="fc-switch">
          <input type="checkbox" class="fc-share-toggle"
                 th:checked="${deck.targetClasses().![id()].contains(c.id())}">
          <span class="fc-switch-track"></span>
        </label>
      </li>
    </ul>
    <!-- Distinct from the "no classes at all" state below; JS toggles this one. -->
    <p class="fc-share-empty" id="fcClassNoMatch" hidden>Không tìm thấy lớp nào khớp.</p>
    <p class="fc-share-empty" th:if="${#lists.isEmpty(shareClasses)}">
      Bạn chưa tham gia lớp nào để chia sẻ.
    </p>
    <p class="fc-share-reach" th:if="${deck.memberCount() > 0}"
       th:text="'Đang chia sẻ tới ' + ${deck.memberCount()} + ' người'">Đang chia sẻ</p>
  </section>

  <section class="fc-share-section">
    <h3 class="fc-section-title">Link công khai</h3>
    <div class="fc-share-row">
      <span class="fc-share-row-name">Bất kỳ ai có link đều xem được</span>
      <label class="fc-switch">
        <input type="checkbox" id="fcPublicToggle" th:checked="${deck.publicLink()}">
        <span class="fc-switch-track"></span>
      </label>
    </div>
    <div class="fc-share-link-box" id="fcShareLinkBox" th:hidden="${!deck.publicLink()}">
      <input type="text" class="fc-share-link-input" id="fcShareLinkInput" readonly>
      <button type="button" class="fc-btn fc-btn-secondary" id="fcShareCopy">Sao chép</button>
      <button type="button" class="fc-btn fc-btn-ghost" id="fcShareRegen">Tạo link mới</button>
    </div>
  </section>
</dialog>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/flashcard-common.js}"></script>
<script th:src="@{/js/flashcard-share.js}" th:if="${deck.owner()}"></script>
</body>
</html>
